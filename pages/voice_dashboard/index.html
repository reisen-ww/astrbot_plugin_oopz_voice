<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OOPZ 语音控制台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0e1a;
      --bg-2: #111827;
      --bg-3: #1f2937;
      --bg-4: #374151;
      --text: #f1f5f9;
      --text-dim: #9ca3af;
      --accent: #3b82f6;
      --accent-glow: rgba(59,130,246,0.3);
      --green: #22c55e;
      --green-glow: rgba(34,197,94,0.2);
      --yellow: #eab308;
      --red: #ef4444;
      --border: #1f2937;
      --radius: 10px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header h1 span { color: var(--accent); }
    .conn-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .conn-badge.on { background: var(--green-glow); color: var(--green); }
    .conn-badge.off { background: rgba(239,68,68,0.15); color: var(--red); }
    .conn-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .conn-badge.on .dot { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .header-actions { display: flex; gap: 8px; }

    /* Buttons */
    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #2563eb; box-shadow: 0 0 12px var(--accent-glow); }
    .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); border-color: var(--text-dim); }
    .btn-danger { background: rgba(239,68,68,0.15); color: var(--red); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .btn-sm { padding: 4px 10px; font-size: 11px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Layout */
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr 300px;
      gap: 0;
      height: calc(100vh - 49px);
    }
    @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }

    /* Sidebar */
    .sidebar {
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    /* Join form */
    .join-form { display: flex; flex-direction: column; gap: 8px; }
    .input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .input:focus { border-color: var(--accent); }
    .input::placeholder { color: var(--text-dim); }
    .input-row { display: flex; gap: 6px; }
    .input-row .input { flex: 1; }

    /* Sessions */
    .session-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 8px;
      transition: border-color 0.15s;
    }
    .session-card:hover { border-color: var(--accent); }
    .session-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .session-key { font-size: 13px; font-weight: 600; font-family: monospace; }
    .state-tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
      text-transform: uppercase;
    }
    .state-idle { background: var(--bg-4); color: var(--text-dim); }
    .state-listen { background: rgba(14,165,233,0.2); color: #38bdf8; }
    .state-stt { background: rgba(99,102,241,0.2); color: #818cf8; }
    .state-think { background: rgba(168,85,247,0.2); color: #c084fc; }
    .state-tts { background: rgba(236,72,153,0.2); color: #f472b6; }
    .state-speak { background: var(--green-glow); color: var(--green); }
    .state-error { background: rgba(239,68,68,0.2); color: var(--red); }
    .session-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
    .session-actions { display: flex; gap: 6px; margin-top: 8px; }

    /* Empty state */
    .empty { text-align: center; padding: 20px; color: var(--text-dim); font-size: 13px; }

    /* Main content */
    .main {
      padding: 20px;
      overflow-y: auto;
    }
    .main h2 {
      font-size: 14px;
      color: var(--text-dim);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Chat log */
    .chat-box {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: calc(100vh - 140px);
      display: flex;
      flex-direction: column;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .chat-input-row {
      padding: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
    }
    .chat-input-row .input { flex: 1; }
    .msg {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .msg-role {
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .msg-role.user { color: #60a5fa; }
    .msg-role.assistant { color: #fbbf24; }
    .msg-role.system { color: var(--text-dim); }
    .msg-text { font-size: 13px; line-height: 1.5; }
    .msg-time { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

    /* Right panel */
    .panel {
      background: var(--bg-2);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .panel-section {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .panel-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .provider-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 12px;
    }
    .provider-label { color: var(--text-dim); }
    .provider-value { font-weight: 500; font-family: monospace; font-size: 11px; }
    .provider-tag {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--bg-3);
      margin: 2px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1><span>OOPZ</span> 语音控制台</h1>
      <div class="conn-badge off" id="connBadge">
        <span class="dot"></span>
        <span id="connText">未连接</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" onclick="refreshAll()">刷新</button>
    </div>
  </div>

  <div class="layout">
    <!-- Left sidebar: sessions + join -->
    <div class="sidebar">
      <div class="sidebar-section">
        <h3>加入频道</h3>
        <div class="join-form">
          <input class="input" id="joinArea" placeholder="area_id">
          <input class="input" id="joinChannel" placeholder="channel_id">
          <button class="btn btn-primary" id="btnJoin" onclick="doJoin()">加入</button>
        </div>
      </div>
      <div class="sidebar-section" style="flex:1;">
        <h3>活跃会话</h3>
        <div id="sessionList"><div class="empty">暂无会话</div></div>
      </div>
    </div>

    <!-- Center: chat log -->
    <div class="main">
      <div class="chat-box">
        <div class="chat-messages" id="chatMessages">
          <div class="empty">语音对话日志将显示在这里</div>
        </div>
        <div class="chat-input-row">
          <input class="input" id="sayArea" placeholder="area_id" style="width:100px;flex:none;">
          <input class="input" id="sayChannel" placeholder="channel_id" style="width:100px;flex:none;">
          <input class="input" id="sayText" placeholder="输入要播报的文字...">
          <button class="btn btn-primary" onclick="doSay()">播报</button>
        </div>
      </div>
    </div>

    <!-- Right panel: providers + persona -->
    <div class="panel">
      <div class="panel-section">
        <h3>Provider</h3>
        <div class="provider-row">
          <span class="provider-label">STT</span>
          <span class="provider-value" id="pvStt">-</span>
        </div>
        <div class="provider-row">
          <span class="provider-label">TTS</span>
          <span class="provider-value" id="pvTts">-</span>
        </div>
        <div class="provider-row">
          <span class="provider-label">LLM</span>
          <span class="provider-value" id="pvLlm">-</span>
        </div>
        <button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="loadProviders()">刷新列表</button>
      </div>
      <div class="panel-section">
        <h3>人格</h3>
        <div class="provider-row">
          <span class="provider-label">人格 ID</span>
          <span class="provider-value" id="pvPersona">-</span>
        </div>
        <div class="provider-row">
          <span class="provider-label">提示词</span>
          <span class="provider-value" id="pvPrompt" style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">-</span>
        </div>
      </div>
      <div class="panel-section">
        <h3>可用 Provider</h3>
        <div id="allProviders" class="empty" style="font-size:12px;">点击"刷新列表"查看</div>
      </div>
      <div class="panel-section">
        <h3>频道历史</h3>
        <div style="display:flex;gap:6px;margin-bottom:8px;">
          <input class="input" id="histArea" placeholder="area_id" style="width:80px;flex:none;font-size:11px;">
          <input class="input" id="histChannel" placeholder="channel_id" style="width:80px;flex:none;font-size:11px;">
          <button class="btn btn-ghost btn-sm" onclick="loadHistory()">加载</button>
        </div>
        <div id="historyList" style="max-height:300px;overflow-y:auto;font-size:12px;">
          <div class="empty">输入 area_id 和 channel_id 加载</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const bridge = window.AstrBotPluginPage;
    let snapshot = { sessions: [], oopz: {}, providers: {}, persona: {} };

    const STATE_CN = {
      idle:'空闲', listen:'监听中', stt:'识别中',
      think:'思考中', tts:'合成中', speak:'播放中', error:'异常'
    };
    const ROLE_CN = { user:'用户', assistant:'助手', system:'系统' };

    function esc(s) {
      return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    // Connection status
    function setStatus(connected, ready) {
      const el = document.getElementById('connBadge');
      const text = document.getElementById('connText');
      el.className = 'conn-badge ' + (connected ? 'on' : 'off');
      text.textContent = connected ? (ready ? '已连接' : '连接中...') : '未连接';
    }

    // Sessions
    function renderSessions() {
      const list = snapshot.sessions || [];
      const el = document.getElementById('sessionList');
      if (!list.length) { el.innerHTML = '<div class="empty">暂无会话</div>'; return; }
      el.innerHTML = list.map(s => `
        <div class="session-card">
          <div class="session-header">
            <span class="session-key">${esc(s.key)}</span>
            <span class="state-tag state-${s.state}">${STATE_CN[s.state]||s.state}</span>
          </div>
          <div class="session-meta">轮次 ${s.turn_count}</div>
          ${s.last_text_in ? `<div class="session-meta" style="color:#60a5fa;">${esc(s.last_text_in.slice(0,40))}</div>` : ''}
          ${s.last_text_out ? `<div class="session-meta" style="color:#fbbf24;">${esc(s.last_text_out.slice(0,40))}</div>` : ''}
          <div class="session-actions">
            <button class="btn btn-ghost btn-sm" onclick="doInterrupt('${s.key}')">打断</button>
            <button class="btn btn-danger btn-sm" onclick="doLeave('${s.key}')">离开</button>
          </div>
        </div>
      `).join('');
    }

    // Providers
    function renderProviders() {
      const pv = snapshot.providers || {};
      document.getElementById('pvStt').textContent = pv.stt || '-';
      document.getElementById('pvTts').textContent = pv.tts || '-';
      document.getElementById('pvLlm').textContent = pv.llm || '(当前会话)';
      const pa = snapshot.persona || {};
      document.getElementById('pvPersona').textContent = pa.active_id || '(自定义)';
      document.getElementById('pvPrompt').textContent = (pa.system_prompt || '').substring(0,50) || '默认';
    }

    function renderProviderList(data) {
      const el = document.getElementById('allProviders');
      const pv = data.providers || {};
      let html = '';
      const renderGroup = (label, list) => {
        html += `<div style="margin-bottom:6px;"><b>${label}:</b> `;
        html += list.length ? list.map(p => `<span class="provider-tag">${esc(p.name||p.id)}</span>`).join('') : '<span style="color:var(--text-dim);">无</span>';
        html += '</div>';
      };
      renderGroup('STT', pv.available_stt || []);
      renderGroup('TTS', pv.available_tts || []);
      renderGroup('LLM', pv.available_llm || []);
      el.innerHTML = html || '<div class="empty">无可用 Provider</div>';
    }

    // Chat log
    function appendLog(role, text) {
      const el = document.getElementById('chatMessages');
      const ts = new Date().toLocaleTimeString('zh-CN');
      const html = `<div class="msg">
        <div class="msg-role ${role}">${ROLE_CN[role]||role}</div>
        <div class="msg-text">${esc(text)}</div>
        <div class="msg-time">${ts}</div>
      </div>`;
      // Remove empty placeholder
      const empty = el.querySelector('.empty');
      if (empty) empty.remove();
      el.insertAdjacentHTML('beforeend', html);
      el.scrollTop = el.scrollHeight;
      // Limit messages
      while (el.childElementCount > 200) el.removeChild(el.firstChild);
    }

    function renderHistory(data) {
      const el = document.getElementById('historyList');
      const history = data.history || [];
      if (!history.length) { el.innerHTML = '<div class="empty">暂无记录</div>'; return; }
      el.innerHTML = history.map(m => {
        const role = m.role || 'system';
        return `<div class="msg">
          <div class="msg-role ${role}">${ROLE_CN[role]||role}</div>
          <div class="msg-text">${esc(m.content||'')}</div>
        </div>`;
      }).join('');
      el.scrollTop = el.scrollHeight;
    }

    // API calls
    async function refreshAll() {
      try {
        const res = await bridge.apiGet('status');
        if (res) {
          snapshot = res;
          renderSessions();
          renderProviders();
          setStatus(res.oopz?.connected, res.oopz?.ready);
        }
      } catch(e) { console.error(e); }
    }

    async function doJoin() {
      const area = document.getElementById('joinArea').value.trim();
      const channel = document.getElementById('joinChannel').value.trim();
      if (!area || !channel) return;
      const btn = document.getElementById('btnJoin');
      btn.disabled = true;
      try {
        const res = await bridge.apiPost('join', { area_id: area, channel_id: channel });
        if (res?.ok) {
          snapshot = res.snapshot || snapshot;
          renderSessions();
        } else {
          alert('加入失败: ' + (res?.error || '未知错误'));
        }
      } finally { btn.disabled = false; }
    }

    async function doLeave(key) {
      const [area, channel] = key.split(':');
      await bridge.apiPost('leave', { area_id: area, channel_id: channel });
      await refreshAll();
    }

    async function doInterrupt(key) {
      const [area, channel] = key.split(':');
      await bridge.apiPost('interrupt', { area_id: area, channel_id: channel });
    }

    async function doSay() {
      const area = document.getElementById('sayArea').value.trim();
      const channel = document.getElementById('sayChannel').value.trim();
      const text = document.getElementById('sayText').value.trim();
      if (!area || !channel || !text) return;
      const res = await bridge.apiPost('say', { area_id: area, channel_id: channel, text });
      if (!res?.ok) alert('播报失败: ' + (res?.error || ''));
    }

    async function loadProviders() {
      const [pv, pr] = await Promise.all([
        bridge.apiGet('providers'),
        bridge.apiGet('personas')
      ]);
      if (pv?.providers) { snapshot.providers = pv.providers; renderProviders(); }
      if (pr) { snapshot.persona = { active_id: pr.active_id || '' }; renderProviders(); }
      renderProviderList(pv || {});
    }

    async function loadHistory() {
      const area = document.getElementById('histArea').value.trim();
      const channel = document.getElementById('histChannel').value.trim();
      if (!area || !channel) return;
      const res = await bridge.apiGet('history?area=' + encodeURIComponent(area) + '&channel=' + encodeURIComponent(channel));
      renderHistory(res || {});
    }

    // SSE
    (async () => {
      await bridge.ready();
      await refreshAll();
      await loadProviders();

      bridge.subscribeSSE('sse', {
        snapshot: (data) => {
          snapshot = data;
          renderSessions();
          renderProviders();
          setStatus(data.oopz?.connected, data.oopz?.ready);
        },
        update: (data) => {
          if (data.type === 'snapshot' && data.snapshot) {
            const s = data.snapshot;
            const idx = (snapshot.sessions||[]).findIndex(x => x.key === s.key);
            if (idx >= 0) snapshot.sessions[idx] = s;
            else (snapshot.sessions = snapshot.sessions||[]).push(s);
            renderSessions();
          } else if (data.type === 'session_left') {
            snapshot.sessions = (snapshot.sessions||[]).filter(s => s.key !== data.key);
            renderSessions();
          } else if (data.type === 'session_joined' && data.snapshot) {
            const k = data.snapshot.key;
            const idx = (snapshot.sessions||[]).findIndex(s => s.key === k);
            if (idx >= 0) snapshot.sessions[idx] = data.snapshot;
            else (snapshot.sessions = snapshot.sessions||[]).push(data.snapshot);
            renderSessions();
          } else if (data.type === 'log') {
            appendLog(data.role, data.text);
          }
        },
      });
    })();
  </script>
</body>
</html>
